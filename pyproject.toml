[project]
name = "prawa-rachunku-zdan"
version = "0.1.0"
description = "Interaktywna strona o prawach i tautologiach rachunku zdań"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["flask>=3.1"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/kanban", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
